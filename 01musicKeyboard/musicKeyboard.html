<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Sugar's musicKeyboard</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <h1>Sugar's musicKeyboard</h1>

        <div class="keys">
            <div data-key="65" class="key">
                <kbd>A</kbd>
                <span class="sound">clap</span>
            </div>
            <div data-key="83" class="key">
                <kbd>S</kbd>
                <span class="sound">hihat</span>
            </div>
            <div data-key="68" class="key">
                <kbd>D</kbd>
                <span class="sound">kick</span>
            </div>
            <div data-key="70" class="key">
                <kbd>F</kbd>
                <span class="sound">openhat</span>
            </div>
            <div data-key="71" class="key">
                <kbd>G</kbd>
                <span class="sound">boom</span>
            </div>
            <div data-key="72" class="key">
                <kbd>H</kbd>
                <span class="sound">ride</span>
            </div>
            <div data-key="74" class="key">
                <kbd>J</kbd>
                <span class="sound">snare</span>
            </div>
            <div data-key="75" class="key">
                <kbd>K</kbd>
                <span class="sound">tom</span>
            </div>
            <div data-key="76" class="key">
                <kbd>L</kbd>
                <span class="sound">tink</span>
            </div>
            <div data-key="66" class="key">
                <kbd>B</kbd>
                <span class="sound">du~du~</span>
            </div>
        </div>

        <audio data-key="65" src="../assets/audio/sounds/clap.wav"></audio>
        <audio data-key="83" src="../assets/audio/sounds/hihat.wav"></audio>
        <audio data-key="68" src="../assets/audio/sounds/kick.wav"></audio>
        <audio data-key="70" src="../assets/audio/sounds/openhat.wav"></audio>
        <audio data-key="71" src="../assets/audio/sounds/boom.wav"></audio>
        <audio data-key="72" src="../assets/audio/sounds/ride.wav"></audio>
        <audio data-key="74" src="../assets/audio/sounds/snare.wav"></audio>
        <audio data-key="75" src="../assets/audio/sounds/tom.wav"></audio>
        <audio data-key="76" src="../assets/audio/sounds/tink.wav"></audio>
        <audio data-key="66" src="../assets/audio/sounds/clap.wav"></audio>

        <script>
            function removeTransition(event){
                if(event.propertyName!=='transform') return;
                event.target.classList.remove('playing');
            }

            function playSound(event){
                const audio=document.querySelector(`audio[data-key="${event.keyCode}"]`);
                const key=document.querySelector(`div[data-key="${event.keyCode}"]`);
                if(!audio) return;

                key.classList.add('playing');
                audio.currentTime=0;
                audio.play();
            }

            const key=Array.from(document.querySelectorAll('.key'));
            key.forEach(key=>key.addEventListener('transitionend',removeTransition));
            window.addEventListener('keydown',playSound);
        </script>
    </body>
</html>
